<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

  <title>クルスタのレシート読みたくないんや</title>

  <meta property="og:locale" content="ja_JP" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="クルスタのレシート読みたくないんや" />
  <meta property="og:description" content="ティンクルスターナイツのスキルを見やすくする試み" />
  <meta property="og:site_name" content="Twinkle Skill Finder" />
  <meta name="description" content="ティンクルスターナイツのスキルを見やすくする試み" />
  <meta name="keywords" content="クルスタ,ティンクルスターナイツ,スキル逆引き">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="finder-shell">
    <main class="finder-main">
        <div class="finder-toolbar">
            <div class="filter-strip">
                <button
                    id="open-filter-panel"
                    class="icon-action filter-launch"
                    type="button"
                    aria-label="絞り込み"
                >
                    <i class="bi bi-sliders" aria-hidden="true"></i>
                </button>

                <div
                    class="result-count"
                    aria-live="polite"
                >
                    <span id="visible-count" class="visible-count">0</span>
                    件
                </div>

                <div
                    id="filter-chip-row"
                    class="filter-chip-row"
                    aria-label="選択中フィルター"
                >
                    <button class="filter-chip" type="button" data-open-filter="effect_categories">効果</button>    
                    <button class="filter-chip" type="button" data-open-filter="rarity">レア</button>
                    
                    <button class="filter-chip" type="button" data-open-filter="attr">属性</button>
                    <button class="filter-chip" type="button" data-open-filter="races">種族</button>
                    <button class="filter-chip" type="button" data-open-filter="role">役割</button>
                    <button class="filter-chip" type="button" data-open-filter="attack_types">武器</button>
                    <button class="filter-chip" type="button" data-open-filter="affiliations">所属</button>
                    <button class="filter-chip" type="button" data-open-filter="obtains">入手</button>
                    <button class="filter-chip" type="button" data-open-filter="release_years">年別</button>
                </div>
            </div>

            <div class="result-actions">
                <button
                    id="compare-mode-toggle"
                    class="toolbar-button"
                    type="button"
                    data-act="toggle-self"
                >
                    <i class="bi bi-ui-checks-grid" aria-hidden="true"></i>
                    比較する
                </button>

                <button
                    id="raw-view-toggle"
                    class="raw-view-toggle"
                    type="button"
                    aria-pressed="true"
                >
                    <i class="bi bi-card-text" aria-hidden="true"></i>
                    原文
                </button>

                <button
                    id="view-mode-toggle"
                    class="view-mode-toggle"
                    type="button"
                    aria-pressed="false"
                    aria-label="表示切替"
                >
                    <span class="view-mode-option detail active">
                        <i class="bi bi-list-ul" aria-hidden="true"></i>
                    </span>
                    <span class="view-mode-option icon">
                        <i class="bi bi-grid" aria-hidden="true"></i>
                    </span>
                </button>

                <div class="sort-menu">
                    <button
                        id="sort-menu-button"
                        class="toolbar-button"
                        type="button"
                        aria-expanded="false"
                        aria-controls="sort-options"
                    >
                        <i class="bi bi-arrow-down-up" aria-hidden="true"></i>
                        <span class="sort-button-label">並べ替え</span>
                    </button>

                    <div
                        id="sort-options"
                        class="sort-options is-hidden"
                    >
                        <button class="sort-option active" type="button" data-sort="release_asc">◉ リリースが古い順</button>
                        <button class="sort-option" type="button" data-sort="release_desc">○ リリースが新しい順</button>
                        <button class="sort-option" type="button" data-sort="rare_desc">○ レアが高い順</button>
                        <button class="sort-option" type="button" data-sort="rare_asc">○ レアが低い順</button>
                        <button class="sort-option" type="button" data-sort="kana_asc">○ 50音順 (あ→ん)</button>
                        <button class="sort-option" type="button" data-sort="kana_desc">○ 50音順 (ん→あ)</button>
                    </div>
                </div>

                <button
                    id="ui-size-toggle"
                    class="toolbar-button"
                    type="button"
                    aria-pressed="false"
                    aria-label="文字サイズ切替"
                >
                    Aa
                </button>
            </div>
        </div>

        <div
            id="empty-result"
            class="empty-result"
            hidden
        >
            該当するスキルがありません
            <br>
            <span style="font-size:12px;font-weight:400">条件をゆるめてください</span>
        </div>

        <div
            id="compare-action-bar"
            class="compare-action-bar is-hidden"
            hidden
        >
            <span id="compare-selected-count" class="selected-cound">0</span>件選択
            <button id="run-compare" class="primary-action" type="button" disabled>比較する</button>
            <button id="cancel-compare" class="toolbar-button" type="button">キャンセル</button>
        </div>

        <div
            id="skill-list"
            class="skill-list"
        ></div>
    </main>

    <aside
        id="filter-panel"
        class="filter-dock"
        aria-label="絞り込み"
    >
        <div
            class="filter-backdrop"
            data-close-filter
        ></div>

        <section class="filter-dock-panel">
            <div class="sheet-grip"></div>
            <div class="dock-head"><i class="bi bi-sliders"></i>絞り込み</div>

            <div class="dock-scroll" id="dock-scroll"></div>

            <div class="sheet-actions">
                <button
                    id="clear-filters"
                    class="clear-filters"
                    type="button"
                >
                    クリア
                </button>

                <button
                    id="apply-filters"
                    class="primary-action"
                    type="button"
                >
                    検索する
                </button>
            </div>
        </section>
    </aside>
</div>

<div
    id="compare-sheet"
    class="compare-sheet"
    hidden
>
    <div
        class="sheet-backdrop"
        data-close-compare
    ></div>

    <section
        class="compare-panel"
        role="dialog"
        aria-modal="true"
        aria-label="スキル比較"
    >
        <div class="compare-header">
            <div>比較</div>
            <button
                class="compare-close-button"
                type="button"
                data-close-compare
                aria-label="閉じる"
            >
                <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
            </button>
        </div>

        <div
            id="compare-table-host"
            class="compare-table-host"
        ></div>
    </section>
</div>

<div
    id="detail-sheet"
    class="detail-sheet"
    hidden
>
    <div
        class="sheet-backdrop"
        data-close-detail
    ></div>

    <section
        class="detail-panel"
        role="dialog"
        aria-modal="true"
        aria-label="スキル詳細"
    >
        <div class="detail-header">
            <div id="detail-title">詳細</div>
            <button
                class="compare-close-button"
                type="button"
                data-close-detail
                aria-label="閉じる"
            >
                <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
            </button>
        </div>

        <div
            id="detail-card-host"
            class="detail-card-host"
        ></div>
    </section>
</div>

<script type="module" src="js/data.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
