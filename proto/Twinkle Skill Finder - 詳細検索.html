<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twinkle Skill Finder — スキル効果 詳細検索プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="finder-shell">
  <main class="finder-main" data-screen-label="results">
    <div class="finder-toolbar">
      <div class="filter-strip">
        <button class="open-filter-panel" data-act="mlaunch" aria-label="絞り込み"><i class="bi bi-sliders"></i></button>
        <div class="m-chips" id="m-chips"></div>
      </div>
      <div class="result-actions">
        <div class="result-count"><b id="count">0</b> 件</div>
        <div class="toolbar-spacer"></div>
        <button id="compare-mode-toggle" class="toolbar-button" type="button" data-act="toggle-self"><i class="bi bi-ui-checks-grid"></i> 比較する</button>
        <button id="raw-view-toggle" class="toolbar-button" type="button" data-act="toggle-self"><i class="bi bi-card-text"></i> 原文</button>
        <button id="view-mode-toggle" class="view-mode-toggle" type="button" data-act="view-mode">
          <span class="view-mode-option detail active"><i class="bi bi-list-ul"></i></span>
          <span class="view-mode-option icon"><i class="bi bi-grid"></i></span>
        </button>
        <button id="sort-menu-button" class="toolbar-button" type="button" data-act="toggle-self"><i class="bi bi-arrow-down-up"></i> 並べ替え</button>
      </div>
    </div>
    <div class="results" id="results"></div>
  </main>

  <aside class="filter-dock" id="filter-dock" data-screen-label="filter-panel">
    <div class="filter-backdrop" data-act="close-sheet"></div>
    <div class="dock-panel">
      <div class="sheet-grip"></div>
      <div class="dock-head"><i class="bi bi-sliders"></i> 絞り込み</div>
      <div class="dock-scroll" id="dock-scroll"></div>
      <div class="dock-foot">
        <button class="btn-ghost" id="clear-btn">クリア</button>
        <button class="btn-primary" data-act="close-sheet">結果を見る</button>
      </div>
    </div>
  </aside>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
